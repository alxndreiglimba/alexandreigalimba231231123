<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in · Event Attendance</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="auth-body">
  <main class="auth-card">
    <p class="eyebrow">Account sign in</p>
    <h1>Event attendance &amp; sanctions</h1>
    <p class="lede">Sign in to create events, mark who showed up, and set how much an absent student must pay.</p>
    {% if error %}
      <p class="banner error">{{ error }}</p>
    {% endif %}
    <form method="post">
      <label>
        Username
        <input type="text" name="username" required autofocus />
      </label>
      <label>
        Password
        <input type="password" name="password" required />
      </label>
      <button type="submit">Log in</button>
    </form>
    <p class="hint"><a href="{{ url_for('register') }}">Create account</a></p>
    <p class="hint">Students can sign in with their student ID to view their own attendance records.</p>
  </main>
</body>
</html>
