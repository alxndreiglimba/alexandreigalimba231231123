<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create account · Event Attendance</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="auth-body">
  <main class="auth-card">
    <p class="eyebrow">New account</p>
    <h1>Create account</h1>
    <p class="lede">{% if allow_admin_registration %}Choose an account type to get started.{% else %}Create a student account.{% endif %}</p>
    {% if error %}
      <p class="banner error">{{ error }}</p>
    {% endif %}
    <form method="post">
      <label>
        Account type
        <select id="role" name="role" required>
          {% if allow_admin_registration %}<option value="admin">Admin</option>{% endif %}
          <option value="student">Student</option>
        </select>
      </label>
      {% if allow_admin_registration %}
      <div id="admin-fields">
        <label>
          Username
          <input type="text" name="username" autocomplete="username" />
        </label>
      </div>
      {% endif %}
      <div id="student-fields" class="hidden">
        <label>
          Student ID
          <input type="text" name="student_id" autocomplete="username" />
        </label>
        <label>
          Full name
          <input type="text" name="full_name" autocomplete="name" />
        </label>
        <label>
          Course <span class="meta">(optional)</span>
          <input type="text" name="course" />
        </label>
      </div>
      <label>
        Password
        <input type="password" name="password" minlength="8" autocomplete="new-password" required />
      </label>
      <button type="submit">Create account</button>
    </form>
    <p class="hint"><a href="{{ url_for('login') }}">Back to log in</a></p>
  </main>
  <script>
    const roleSelect = document.getElementById("role");
    const studentFields = document.getElementById("student-fields");
    const studentInputs = studentFields.querySelectorAll("input");
    const adminFields = document.getElementById("admin-fields");
    const adminUsername = adminFields ? adminFields.querySelector("input") : null;

    function updateAccountFields() {
      const isStudent = !adminFields || roleSelect.value === "student";
      if (adminFields) {
        adminFields.classList.toggle("hidden", isStudent);
        adminUsername.required = !isStudent;
      }
      studentFields.classList.toggle("hidden", !isStudent);
      studentInputs[0].required = isStudent;
      studentInputs[1].required = isStudent;
    }

    roleSelect.addEventListener("change", updateAccountFields);
    updateAccountFields();
  </script>
</body>
</html>
